      <p><img src="mobile/ux-catalog.webp" width="550" height="200" alt="Дизайн построен вокруг ощущения витрины: пользователь сразу видит популярные категории, промо-блоки, товары и быстрые точки входа в каталог. При этом интерфейс остаётся понятным и не перегружает пользователя лишними действиями" loading="lazy"></p>
